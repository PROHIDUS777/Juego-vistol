<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Victor Parkour - GD Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        
        #menu, #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 10; text-align: center;
            background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.95) 100%);
        }

        #game-over { 
            display: none; 
            background: rgba(20, 0, 0, 0.95); /* Fondo mucho más oscuro y rojizo */
            border: 20px solid #ff0000;
            box-sizing: border-box;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        h1 { 
            font-size: 80px; margin: 0; 
            background: linear-gradient(to bottom, #00ffcc, #0088ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        #death-title {
            font-size: 90px;
            color: #ff0000;
            background: none;
            -webkit-text-fill-color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
            margin-bottom: 10px;
        }

        .tuto-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0;
        }

        .tuto-item { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border: 1px solid #333; }

        button {
            padding: 20px 60px; font-size: 28px; background: #00ffcc; color: #000;
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: 0.2s; text-transform: uppercase;
        }

        button:hover { transform: scale(1.1); background: #fff; }

        #hud {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-size: 40px; display: none; font-weight: 900;
            text-shadow: 3px 3px 0px #000; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="menu">
        <div class="glass-panel">
            <h1>VICTOR PARKOUR</h1>
            <div class="tuto-grid">
                <div class="tuto-item">🕹️ <b>WASD</b></div>
                <div class="tuto-item">🚀 <b>ESPACIO</b> (X2)</div>
                <div class="tuto-item">💰 <b>ORO</b> +3</div>
                <div class="tuto-item" style="border-color: red;">⚠️ <b>PINCHOS</b> MUERTE</div>
            </div>
            <button onclick="startGame()">¡EMPEZAR!</button>
        </div>
    </div>

    <div id="game-over">
        <h1 id="death-title">¡HAS MUERTO!</h1>
        <p style="font-size: 30px; color: #aaa;">CUIDADO CON LOS PINCHOS</p>
        <p id="final-score" style="font-size: 40px; margin: 20px 0;">Score: 0</p>
        <button onclick="location.reload()" style="background: #ff0000; color: white;">REINTENTAR</button>
    </div>

    <div id="hud">SCORE: <span id="score">0</span></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

        // --- LUCES ---
        const sunGroup = new THREE.Group();
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunGroup.add(sunLight);
        scene.add(sunGroup);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- JUGADOR (CUBO) ---
        const player = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 1.2, 1.2),
            new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.4 })
        );
        player.position.set(0, 5, 0);
        scene.add(player);

        // --- VARIABLES ---
        let score = 0, speed = 0.28, gameRunning = false, platformCount = 0;
        let velY = 0, gravity = -0.015, jumpsAvailable = 2;
        let targetRotation = 0; // Para la animación tipo Geometry Dash
        const keys = { w: false, a: false, s: false, d: false };
        const platforms = [], coins = [], clouds = [];
        let time = 0;

        // --- FUNCIONES ---
        function createSpikes(parent) {
            const spikeGeo = new THREE.ConeGeometry(0.5, 1.8, 6);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000 });
            for(let i = -2; i <= 2; i++) {
                for(let j = -1; j <= 1; j++) {
                    const spike = new THREE.Mesh(spikeGeo, spikeMat);
                    spike.position.set(i * 1.5, 1.1, j * 3);
                    parent.add(spike);
                }
            }
        }

        function spawnPlatform(z, isFirst = false) {
            platformCount++;
            const isSpike = platformCount % 7 === 0 && !isFirst;
            const plat = new THREE.Mesh(
                new THREE.BoxGeometry(8, 1, 12), 
                new THREE.MeshStandardMaterial({ color: isSpike ? 0x111111 : 0xff4466 })
            );
            plat.position.set(isFirst ? 0 : (Math.random() - 0.5) * 20, 0, z);
            scene.add(plat);
            platforms.push(plat);
            if (isSpike) createSpikes(plat);
            else if (!isFirst && Math.random() > 0.4) {
                const coinGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.2, 16);
                const coin = new THREE.Mesh(coinGeo, new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00 }));
                coin.rotation.x = Math.PI / 2;
                coin.position.set(plat.position.x, 2.5, z);
                scene.add(coin);
                coins.push(coin);
            }
        }

        for(let i = 0; i < 12; i++) spawnPlatform(-i * 22, i === 0);

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space' && gameRunning && jumpsAvailable > 0) {
                velY = 0.35; 
                jumpsAvailable--;
                targetRotation -= Math.PI / 2; // Rota 90 grados por salto
            }
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });

        window.startGame = () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            gameRunning = true;
        };

        function animate() {
            requestAnimationFrame(animate);
            if (!gameRunning) return;

            // Ciclo Día/Noche
            time += 0.001;
            sunGroup.position.set(0, Math.sin(time) * 100, Math.cos(time) * 100 + player.position.z);
            scene.background = new THREE.Color(0x87ceeb).lerp(new THREE.Color(0x050510), 1 - Math.max(0, Math.sin(time)));

            // Física y Animación de Rotación (Geometry Dash Style)
            velY += gravity;
            player.position.y += velY;
            
            // Suavizar la rotación hacia el objetivo
            player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, targetRotation, 0.1);

            // Controles
            if (keys.w) player.position.z -= 0.25;
            if (keys.s) player.position.z += 0.25;
            if (keys.a) player.position.x -= 0.25;
            if (keys.d) player.position.x += 0.25;

            // Monedas
            coins.forEach((c, i) => {
                c.position.z += speed;
                c.rotation.z += 0.05;
                if (player.position.distanceTo(c.position) < 2) {
                    score += 3; document.getElementById('score').innerText = score;
                    scene.remove(c); coins.splice(i, 1);
                }
            });

            // Plataformas
            platforms.forEach(p => {
                p.position.z += speed;
                const dx = Math.abs(player.position.x - p.position.x);
                const dz = Math.abs(player.position.z - p.position.z);
                
                if (dx < 4.5 && dz < 6.5 && player.position.y <= 1.1 && player.position.y > 0 && velY < 0) {
                    if (p.children.length > 0) { // MUERTE POR PINCHOS
                        gameRunning = false;
                        document.getElementById('game-over').style.display = 'flex';
                        document.getElementById('final-score').innerText = "Score: " + score;
                        return;
                    }
                    player.position.y = 1.1; velY = 0; jumpsAvailable = 2;
                    // Al tocar suelo, alineamos la rotación al ángulo recto más cercano
                    targetRotation = Math.round(player.rotation.x / (Math.PI/2)) * (Math.PI/2);
                }

                if (p.position.z > player.position.z + 25) {
                    let minZ = 0; platforms.forEach(plat => { if(plat.position.z < minZ) minZ = plat.position.z; });
                    while(p.children.length > 0) p.remove(p.children[0]);
                    p.position.z = minZ - 22;
                    p.position.x = (Math.random() - 0.5) * 20;
                    platformCount++;
                    const isSpike = platformCount % 7 === 0;
                    p.material.color.set(isSpike ? 0x111111 : 0xff4466);
                    if (isSpike) createSpikes(p);
                    score++; document.getElementById('score').innerText = score;
                    speed += 0.001;
                }
            });

            if (player.position.y < -15) { // CAÍDA AL VACÍO
                gameRunning = false;
                document.getElementById('game-over').style.display = 'flex';
                document.getElementById('final-score').innerText = "Score: " + score;
            }

            camera.position.lerp(new THREE.Vector3(player.position.x * 0.4, player.position.y + 8, player.position.z + 15), 0.1);
            camera.lookAt(player.position.x, player.position.y, player.position.z - 5);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
