<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciudad Estrecho · Mapa del mundo</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#e8edf0;font:14px system-ui,Segoe UI,Arial}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:18px;padding:12px 18px;background:#17232d;border-bottom:1px solid #34434d;z-index:2}
h1{font-size:16px;margin:0;letter-spacing:.04em}#status{color:#b8c8ce;font-size:13px;flex:1}#pct{font-variant-numeric:tabular-nums;color:#f0c77a}
main{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}
#errbox{display:none;position:absolute;left:12px;right:12px;bottom:12px;max-height:30%;overflow:auto;white-space:pre-wrap;background:#421f25;border:1px solid #b95b65;padding:12px;border-radius:8px;color:#ffe3e5;z-index:5}
#hint{position:absolute;left:14px;bottom:14px;background:#14212bdc;border:1px solid #45545c;border-radius:8px;padding:8px 11px;color:#dce5e8;pointer-events:none}
#tip{position:absolute;display:none;pointer-events:none;background:#101820ed;border:1px solid #71818a;padding:7px 10px;border-radius:6px;z-index:3}
#legend{position:absolute;right:14px;top:14px;background:#14212be8;border:1px solid #45545c;border-radius:8px;padding:10px 12px;line-height:1.8}
.sw{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:7px}
button{background:#263945;color:#eef;border:1px solid #50636e;border-radius:6px;padding:6px 10px;cursor:pointer}
@media(max-width:600px){header{gap:8px;padding:9px}h1{font-size:13px}#legend{font-size:11px}#hint{font-size:11px}}
</style>
</head>
<body>
<div id="app">
<header><h1>CIUDAD ESTRECHO</h1><div id="status">Preparando módulos…</div><span id="pct">0%</span><button id="reset">Vista completa</button></header>
<main><canvas id="map"></canvas><div id="tip"></div>
<div id="legend"><div><span class="sw" style="background:#e8d3a2"></span>Autopistas / nacionales</div><div><span class="sw" style="background:#d5b77b"></span>Carreteras</div><div>● Ciudades y pueblos</div></div>
<div id="hint">Rueda: zoom · Arrastrar: mover · Pasa sobre una ciudad para ver su nombre</div><pre id="errbox"></pre></main>
</div>
<script src="./01_core.js"></script>
<script src="./02_world.js"></script>
<script>
(async function(){
 const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
 const status=document.getElementById('status'),pct=document.getElementById('pct'),tip=document.getElementById('tip');
 let W=0,H=0,scale=1,ox=0,oy=0,drag=null,terrain=null,cityScreen=[];
 const fit=()=>{const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));W=canvas.width;H=canvas.height;ctx.setTransform(d,0,0,d,0,0);draw();};
 function bounds(){const sx=(canvas.clientWidth)/(WORLD.maxX-WORLD.minX),sy=(canvas.clientHeight)/(WORLD.maxZ-WORLD.minZ);return Math.min(sx,sy)*.94}
 function reset(){scale=1;const s=bounds();ox=(canvas.clientWidth-(WORLD.maxX-WORLD.minX)*s)/2;oy=(canvas.clientHeight-(WORLD.maxZ-WORLD.minZ)*s)/2;draw()}
 function xy(x,z){const s=bounds()*scale;return [ox+(x-WORLD.minX)*s,oy+(z-WORLD.minZ)*s]}
 function draw(){
  if(!W||!H)return;const cw=canvas.clientWidth,ch=canvas.clientHeight;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  const d=Math.min(devicePixelRatio||1,2);ctx.setTransform(d,0,0,d,0,0);
  ctx.fillStyle='#123746';ctx.fillRect(0,0,cw,ch);
  if(!WMAP.ready||!WMAP.hm){ctx.fillStyle='#fff';ctx.fillText('Generando mapa…',24,30);return}
  const m=WMAP, s=bounds()*scale, left=(0-ox)/s+WORLD.minX, top=(0-oy)/s+WORLD.minZ;
  const right=(cw-ox)/s+WORLD.minX,bottom=(ch-oy)/s+WORLD.minZ;
  const x0=Math.max(0,Math.floor((left-m.x0)/m.sx)),x1=Math.min(m.w,Math.ceil((right-m.x0)/m.sx));
  const y0=Math.max(0,Math.floor((top-m.z0)/m.sz)),y1=Math.min(m.h,Math.ceil((bottom-m.z0)/m.sz));
  if(!terrain){terrain=document.createElement('canvas');terrain.width=m.w;terrain.height=m.h;const t=terrain.getContext('2d'),im=t.createImageData(m.w,m.h);for(let j=0;j<m.h;j++)for(let i=0;i<m.w;i++){const h=m.hm[j*m.w+i],col=mapColor(m.x0+(i+.5)*m.sx,m.z0+(j+.5)*m.sz,h),k=(j*m.w+i)*4;im.data[k]=col[0]*255;im.data[k+1]=col[1]*255;im.data[k+2]=col[2]*255;im.data[k+3]=255}t.putImageData(im,0,0)}
  const px=xy(m.x0+x0*m.sx,m.z0+y0*m.sz),pw=(x1-x0)*m.sx*s,ph=(y1-y0)*m.sz*s;
  ctx.imageSmoothingEnabled=true;ctx.drawImage(terrain,x0,y0,x1-x0,y1-y0,px[0],px[1],pw,ph);
  // Ríos
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#68b9c7';ctx.lineWidth=Math.max(1,2.4*scale);
  for(const r of RIVERS){ctx.beginPath();r.pts.forEach((p,i)=>{const q=xy(p.x,p.z);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke()}
  // Carreteras
  for(const r of ROADS){ctx.beginPath();r.pts.forEach((p,i)=>{const q=xy(p.x,p.z);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.strokeStyle=r.type==='highway'?'#f0d49b':(['national','secondary'].includes(r.type)?'#d5b77b':'#b6a27e');ctx.lineWidth=Math.max(.65,(r.type==='highway'?2.6:r.type==='national'?1.8:1.1)*scale);ctx.stroke()}
  cityScreen=[];for(const c of CITIES){const q=xy(c.cx,c.cz),rad=Math.max(2.5,Math.min(8,3.5*scale));cityScreen.push({x:q[0],y:q[1],r:rad,c});ctx.beginPath();ctx.arc(q[0],q[1],rad,0,Math.PI*2);ctx.fillStyle='#fff0c7';ctx.fill();ctx.strokeStyle='#463b2a';ctx.lineWidth=1;ctx.stroke();if(scale>0.65){ctx.font=`${Math.max(10,12* Math.min(scale,1.4))}px system-ui`;ctx.fillStyle='#fff';ctx.shadowColor='#17232d';ctx.shadowBlur=4;ctx.fillText(c.name,q[0]+rad+4,q[1]-rad-2);ctx.shadowBlur=0}}
 }
 function resize(){fit();reset()}window.addEventListener('resize',resize);
 canvas.addEventListener('wheel',e=>{e.preventDefault();const old=scale,ns=Math.max(.55,Math.min(12,scale*Math.exp(-e.deltaY*.001)));const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=ns/old;ox=mx-(mx-ox)*k;oy=my-(my-oy)*k;scale=ns;draw()},{passive:false});
 canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox,oy};canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{if(drag){ox=drag.ox+e.clientX-drag.x;oy=drag.oy+e.clientY-drag.y;draw();return}const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,c=cityScreen.find(v=>Math.hypot(v.x-x,v.y-y)<Math.max(10,v.r+5));if(c){tip.style.display='block';tip.textContent=c.c.name;tip.style.left=(x+14)+'px';tip.style.top=(y+14)+'px'}else tip.style.display='none'});
 canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
 document.getElementById('reset').addEventListener('click',reset);
 try{
  if(typeof initWorld!=='function')throw new Error('No se ha cargado initWorld(). Comprueba que 01_core.js y 02_world.js están junto a este HTML.');
  status.textContent='Generando geografía, ciudades y carreteras…';
  await initWorld((f,t)=>{status.textContent=t||'Generando mundo…';pct.textContent=Math.round(f*100)+'%';});
  status.textContent=`Mundo listo · ${CITIES.length} ciudades · ${ROADS.length} carreteras · ${POIS.length} puntos de interés`;
  pct.textContent='100%';resize();
 }catch(e){status.textContent='Error al generar el mundo';document.getElementById('errbox').style.display='block';document.getElementById('errbox').textContent=(e&&e.stack)||String(e);console.error(e)}
})();
</script>
</body></html>
